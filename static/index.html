<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Agentic Research Assistant</title>
  <style>
    :root { --bg:#0f172a; --card:#1e293b; --ink:#e2e8f0; --muted:#94a3b8; --accent:#38bdf8; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
           background: var(--bg); color: var(--ink); line-height: 1.5; }
    .wrap { max-width: 820px; margin: 0 auto; padding: 32px 20px 64px; }
    h1 { font-size: 1.5rem; margin: 0 0 4px; }
    p.sub { color: var(--muted); margin: 0 0 24px; }
    form { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
    input[type=text] { flex: 1 1 340px; padding: 12px 14px; border-radius: 8px; border: 1px solid #334155;
                       background: var(--card); color: var(--ink); font-size: 1rem; }
    button { padding: 12px 20px; border: 0; border-radius: 8px; background: var(--accent);
             color: #04263a; font-weight: 600; cursor: pointer; font-size: 1rem; }
    button:disabled { opacity: .5; cursor: default; }
    .log { background: var(--card); border-radius: 10px; padding: 14px 16px; margin-bottom: 20px;
           font-size: .9rem; max-height: 260px; overflow-y: auto; }
    .log .row { padding: 3px 0; border-bottom: 1px solid #263042; }
    .log .agent { color: var(--accent); font-weight: 600; }
    .report { background: var(--card); border-radius: 10px; padding: 8px 26px 24px; }
    .report h1 { font-size: 1.4rem; margin: 18px 0 8px; }
    .report h2 { font-size: 1.15rem; margin: 22px 0 6px; border-bottom: 1px solid #2a3547; padding-bottom: 4px; }
    .report h3 { font-size: 1rem; margin: 16px 0 4px; color: #cbd5e1; }
    .report p { margin: 10px 0; }
    .report ul, .report ol { margin: 10px 0; padding-left: 22px; }
    .report li { margin: 4px 0; }
    .report a { color: var(--accent); text-decoration: none; }
    .report a:hover { text-decoration: underline; }
    .report code { background: #0b1220; padding: 1px 5px; border-radius: 4px; font-size: .9em; }
    .score { color: var(--muted); font-size: .9rem; margin: 8px 0 4px; }
    .hidden { display: none; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.0/marked.min.js"></script>
</head>
<body>
  <div class="wrap">
    <h1>🧠 Agentic Research Assistant</h1>
    <p class="sub">A Planner → Researcher → Writer → Critic pipeline of Claude agents.</p>

    <form id="form">
      <input id="goal" type="text" placeholder="e.g. How will agentic AI change software testing?" required />
      <button id="go" type="submit">Research</button>
    </form>

    <div id="log" class="log hidden"></div>
    <div id="out" class="report hidden"></div>
  </div>

  <script>
    const form = document.getElementById('form');
    const goal = document.getElementById('goal');
    const go = document.getElementById('go');
    const logEl = document.getElementById('log');
    const out = document.getElementById('out');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      go.disabled = true; go.textContent = 'Working…';
      logEl.classList.remove('hidden'); out.classList.add('hidden');
      logEl.innerHTML = '<div class="row"><span class="agent">System</span> — agents are working, this can take ~30–60s…</div>';

      try {
        const res = await fetch('/api/run', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ goal: goal.value, rounds: 2 }),
        });

        if (!res.ok) {
          let detail = await res.text();
          try { detail = JSON.parse(detail).error || detail; } catch (_) {}
          logEl.innerHTML = `<div class="row">Server error: ${detail}</div>`;
          return;
        }
        const data = await res.json();

        logEl.innerHTML = data.log.map(r =>
          `<div class="row"><span class="agent">${r.agent}</span> — ${r.message}</div>`).join('');

        out.classList.remove('hidden');
        const body = window.marked ? marked.parse(data.report) : data.report.replace(/</g, '&lt;');
        out.innerHTML = `<div class="score">${data.title} · score ${data.score}/10 · ${data.rounds} round(s)</div>` + body;
        // Open all citation/source links in a new tab.
        out.querySelectorAll('a').forEach(a => { a.target = '_blank'; a.rel = 'noopener'; });
      } catch (err) {
        logEl.innerHTML += `<div class="row">Error: ${err}</div>`;
      } finally {
        go.disabled = false; go.textContent = 'Research';
      }
    });
  </script>
</body>
</html>
